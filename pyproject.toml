[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gremlins"
version = "0.1.0"
description = "Caller-independent local capability runtime for software-development automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
]

[project.scripts]
gremlins = "gremlins.cli:main"
agentctl = "gremlins.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gremlins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=9,<10"]
