name: Claude RCA Issue 23

on:
  push:
    branches:
      - claude/rca-issue-23

permissions:
  contents: read

jobs:
  rca:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact failing main
        uses: actions/checkout@v7.0.1
        with:
          ref: 3f517c6fa3b2cd5dd44c5591a425525de9cd9a6c

      - name: Install pinned Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.283
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run independent read-only RCA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "ERROR: no Claude credential secret is configured for this repository"
            exit 2
          fi

          PROMPT=$(cat <<'EOF'
You are performing an independent root-cause analysis of a deterministic retrieval bug in this repository.

Do not edit files. Inspect the checked-out repository yourself using only read/search tools. Do not propose a benchmark-specific hard-code.

Observed failing probe on this exact source SHA:

detail= focused
budget= 3600
result_chars= 3575
truncated= True
files= ['src/gremlins/retrieval.py', 'tests/test_evidence_service.py', 'README.md', 'evals/pilot/cases.json']
FOCUSED_PATH_PRESENT=PASS
reasons= ['caller-focused path', 'focused symbol definition', 'matched 2 query term(s)']
excerpt starts at:
311: def _fallback_terms_for_missed_phrases(
312:     task: str,
313:     search_terms: Sequence[str],
314:     search_meta: dict,
315:     limit: int = 2,
...
EFFECTIVE_TERMS_DEFINITION=FAIL

Request:
- focused path: src/gremlins/retrieval.py
- terms: effective_search_terms ; def ; terms: list ; symbols: list
- task: Find the function definition that chooses between orchestrator-supplied terms/symbols parameters and fallback keyword extraction to build effective_search_terms.

Expected relevant definition: effective_terms(...) near the top of src/gremlins/retrieval.py.

Constraints:
- evidence_pack is deterministic and model-free.
- focused result budget remains <=3600 chars.
- caller-focused paths must remain preserved.
- exact caller-supplied symbol names should remain the strongest signal.
- do not hard-code effective_terms or this benchmark case.
- seek a general structural rule for Python function/class definition ranking.

Produce Markdown with:
1. Root cause
2. Why current scoring ranks _fallback_terms_for_missed_phrases above effective_terms
3. Smallest general fix
4. Risks / counterexamples
5. Exact regression tests
6. Whether exact parameter-name hints from "terms: list" / "symbols: list" are a sound signal and how they should be weighted relative to exact symbol-name and loose body-token overlap

Cite concrete file paths, function names, and line ranges from the checked-out repository. Do not make code changes.
EOF
)

          claude -p "$PROMPT" --output-format text --permission-mode dontAsk --max-turns 12 --no-session-persistence --allowedTools Read Grep Glob --disallowedTools Bash WebSearch WebFetch Write Edit NotebookEdit Agent > "$RUNNER_TEMP/claude-rca-23.md"

          echo "===== CLAUDE RCA ====="
          cat "$RUNNER_TEMP/claude-rca-23.md"

      - name: Upload RCA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-rca-issue-23-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/claude-rca-23.md
