name: Claude Integration Savings Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install Gremlins
        run: uv sync --locked

      - name: Install pinned Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.283
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run diagnostic and full frontier gate
        env:
          GREMLINS_STATE_DIR: ${{ runner.temp }}/gremlins-state
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/run_frontier_gate_ci.sh

      - name: Upload public-safe benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/gremlins-state/benchmarks/*.jsonl
            ${{ runner.temp }}/gremlins-state/benchmarks/*.meta.json
            ${{ runner.temp }}/gremlins-state/results/*.json
